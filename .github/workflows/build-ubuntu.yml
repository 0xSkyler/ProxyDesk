name: DOM v0.5.17 Linux build and regression

on:
  push:
    branches: [main]
    tags: ['v0.5.17']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the immutable Linux release after all checks pass
        type: boolean
        default: false
      verified_run_id:
        description: Optional successful run to publish without rebuilding its tested artifacts
        default: ''
      soak_seconds:
        description: Local fixture active seconds per build (60 for CI, 3600+ for soak)
        default: '60'
      browsers:
        description: Concurrent fixture browser count, 1 to 100
        default: '10'

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    if: inputs.verified_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 apparmor
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Check the bundled Electron Node runtime
        run: node scripts/check-bundled-runtime.cjs
      - name: Build from tracked application source
        run: npm run package:linux
      - name: Check production archive
        run: node scripts/check-package.cjs
      - name: Packaged renderer and lifecycle smoke test
        run: xvfb-run -a node scripts/benchmark.cjs release-linux/linux-unpacked . .measurements/smoke.json 2 20
      - name: Recognize and open progressively rendered Google results
        run: xvfb-run -a node scripts/smoke-google-recognition.cjs release-linux/linux-unpacked/dom
      - name: Verify native Google prompts and cycle cache cleanup
        run: xvfb-run -a node scripts/smoke-google-prompts.cjs release-linux/linux-unpacked/dom
      - name: Verify forward reading and thirty-second page dwell
        run: xvfb-run -a node scripts/smoke-keep-alive-reading.cjs release-linux/linux-unpacked/dom
      - name: Verify AppImage startup and clean exit
        run: |
          xvfb-run -a node scripts/smoke-runtime.cjs release-linux/DOM-v0.5.17-linux-x86_64.AppImage
          node scripts/smoke-appimage.cjs
      - name: Verify installed production sandbox
        run: |
          sudo install -d -m 755 /opt/dom/ci
          sudo cp -a release-linux/linux-unpacked/. /opt/dom/ci/
          sudo chown -R root:root /opt/dom/ci
          sudo chmod -R go-w /opt/dom/ci
          sudo chmod 755 /opt/dom/ci/dom
          sudo chmod 4755 /opt/dom/ci/chrome-sandbox
          python3 - <<'PY'
          from pathlib import Path
          installer = Path('deploy/install-ubuntu.sh').read_text()
          profile = installer.split("<<'PROFILE'\n", 1)[1].split('\nPROFILE', 1)[0]
          Path('/tmp/dom-linux').write_text(profile + '\n')
          PY
          sudo apparmor_parser -r /tmp/dom-linux
          DOM_TEST_SANDBOX=1 xvfb-run -a node scripts/smoke-runtime.cjs /opt/dom/ci/dom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOM-v0.5.17-Ubuntu-x64
          path: |
            release-linux/*.AppImage
            release-linux/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOM-Linux-packaged-smoke
          path: |
            .measurements/smoke.json
            .measurements/appimage-smoke.log
          if-no-files-found: error
          retention-days: 30

  compare-runtime:
    if: inputs.verified_run_id == '' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: DOM-v0.5.17-Ubuntu-x64
          path: .measurements/download
      - name: Prepare packaged runtime and hash-verified reference (benchmark only)
        run: |
          mkdir -p .measurements/runtime
          tar -xzf .measurements/download/DOM-v0.5.17-linux-x64.tar.gz -C .measurements/runtime --strip-components=1
          npm run recover
          node scripts/compare-reference.cjs
      - name: Measure original v0.5.4
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '60' }}
          BROWSERS: ${{ inputs.browsers || '10' }}
        run: xvfb-run -a node scripts/benchmark.cjs .measurements/runtime .recovery/reference .measurements/baseline.json "$SOAK_SECONDS" "$BROWSERS"
      - name: Measure optimized source
        if: always()
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '60' }}
          BROWSERS: ${{ inputs.browsers || '10' }}
        run: xvfb-run -a node scripts/benchmark.cjs .measurements/runtime . .measurements/optimized.json "$SOAK_SECONDS" "$BROWSERS"
      - name: Compare saved measurements
        if: always()
        run: |
          node scripts/compare-benchmarks.cjs .measurements/baseline.json .measurements/optimized.json .measurements/comparison.md
          cat .measurements/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOM-Linux-baseline-comparison
          path: .measurements/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOM-Linux-comparison-report
          path: .measurements/comparison.md
          retention-days: 30

  publish-linux:
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.verified_run_id != '') || (((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v0.5.17')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) && needs.build-linux.result == 'success' && needs.compare-runtime.result == 'success'))
    needs: [build-linux, compare-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Select artifacts from a verified run
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="${VERIFIED_RUN_ID:-$GITHUB_RUN_ID}"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/dom-verified-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/dom-verified-jobs.json
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const run = JSON.parse(fs.readFileSync('/tmp/dom-verified-run.json'));
          const { jobs } = JSON.parse(fs.readFileSync('/tmp/dom-verified-jobs.json'));
          assert.equal(run.repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.path, '.github/workflows/build-ubuntu.yml');
          assert.match(run.head_sha, /^[0-9a-f]{40}$/);
          for (const name of ['build-linux', 'compare-runtime']) {
            const job = jobs.find((job) => job.name === name);
            assert.ok(job && job.status === 'completed' && job.conclusion === 'success', `${name} must pass in the selected run`);
          }
          if (process.env.VERIFIED_RUN_ID) {
            assert.equal(run.status, 'completed');
            assert.equal(run.conclusion, 'success');
          } else {
            assert.equal(run.head_sha, process.env.GITHUB_SHA);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${run.id}\nsource_sha=${run.head_sha}\n`);
          console.log(`Publishing tested artifacts from run ${run.id}, source ${run.head_sha}`);
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.verified.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: DOM-v0.5.17-Ubuntu-x64
          path: release-linux
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: DOM-Linux-comparison-report
          path: release-linux
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: DOM-Linux-baseline-comparison
          path: release-linux
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish verified Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SOURCE_SHA: ${{ steps.verified.outputs.source_sha }}
        run: |
          set -euo pipefail
          cat > /tmp/dom-linux-release-notes.md <<'NOTES'
          DOM 0.5.17 automatically clicks Google’s Accept all button on cookie dialogs and separate consent pages. It clicks Continue on request-verification screens once enabled, then resumes the same search without waiting for Ready or full loading. Each browser handles its own prompts; disabled buttons, CAPTCHA controls and unrelated website buttons are not activated.

          Every proxy cycle stops outgoing work and clears each selected browser’s HTTP cache, renderer memory cache and Cache Storage before proxy fetching and searching start. Cleanup runs two browsers at a time, preserves consent cookies, and remains cancellable. Failures stop the cycle and report an error.

          Immediate actual Google result-title clicks and forward Keep Alive reading with at least 30 seconds per page remain in place. Validation includes native prompt/redirect/independent-browser/cache tests, 76 Google layouts, 23 opening scenarios, the 50-browser unfinished-load test and real Keep Alive reading/Stop checks. SHA-256 checksums are included.
          NOTES
          TAG="$(node -p 'require("./package.json").linuxRelease')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; its artifacts will not be overwritten."
            exit 0
          fi
          cd release-linux
          sha256sum *.AppImage *.tar.gz > SHA256SUMS
          cd ..
          target_args=(--target "$VERIFIED_SOURCE_SHA")
          if [[ "$VERIFIED_SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            # GITHUB_TOKEN cannot create a tag on another workflow commit.
            # Historical publication requires a tag created with repository credentials.
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$VERIFIED_SOURCE_SHA"
            target_args=(--verify-tag)
          fi
          gh release create "$TAG" release-linux/*.AppImage release-linux/*.tar.gz release-linux/SHA256SUMS release-linux/comparison.md release-linux/baseline.json release-linux/optimized.json "${target_args[@]}" --latest=false --title "DOM v0.5.17 for Ubuntu 24.04" --notes-file /tmp/dom-linux-release-notes.md
