name: DOM v0.5.6 Linux build and regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Local fixture active seconds per build (60 for CI, 3600+ for soak)
        default: '60'
      browsers:
        description: Concurrent fixture browser count, 1 to 100
        default: '10'

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 apparmor
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Check the bundled Electron Node runtime
        run: ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron --test tests/*.test.cjs
      - name: Build from tracked application source
        run: npm run package:linux
      - name: Check production archive
        run: node scripts/check-package.cjs
      - name: Packaged renderer and lifecycle smoke test
        run: xvfb-run -a node scripts/benchmark.cjs release-linux/linux-unpacked . .measurements/smoke.json 2 3
      - name: Verify AppImage startup and clean exit
        run: |
          xvfb-run -a node scripts/smoke-runtime.cjs release-linux/DOM-v0.5.6-linux-x86_64.AppImage
          node scripts/smoke-appimage.cjs
      - name: Verify installed production sandbox
        run: |
          sudo install -d -m 755 /opt/dom/ci
          sudo cp -a release-linux/linux-unpacked/. /opt/dom/ci/
          sudo chown -R root:root /opt/dom/ci
          sudo chmod -R go-w /opt/dom/ci
          sudo chmod 755 /opt/dom/ci/dom
          sudo chmod 4755 /opt/dom/ci/chrome-sandbox
          python3 - <<'PY'
          from pathlib import Path
          installer = Path('deploy/install-ubuntu.sh').read_text()
          profile = installer.split("<<'PROFILE'\n", 1)[1].split('\nPROFILE', 1)[0]
          Path('/tmp/dom-linux').write_text(profile + '\n')
          PY
          sudo apparmor_parser -r /tmp/dom-linux
          DOM_TEST_SANDBOX=1 xvfb-run -a node scripts/smoke-runtime.cjs /opt/dom/ci/dom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOM-v0.5.6-Ubuntu-x64
          path: |
            release-linux/*.AppImage
            release-linux/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOM-Linux-packaged-smoke
          path: |
            .measurements/smoke.json
            .measurements/appimage-smoke.log
          if-no-files-found: error
          retention-days: 30

  compare-runtime:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: DOM-v0.5.6-Ubuntu-x64
          path: .measurements/download
      - name: Prepare packaged runtime and hash-verified reference (benchmark only)
        run: |
          mkdir -p .measurements/runtime
          tar -xzf .measurements/download/DOM-v0.5.6-linux-x64.tar.gz -C .measurements/runtime --strip-components=1
          npm run recover
          node scripts/compare-reference.cjs
      - name: Measure original v0.5.4
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '60' }}
          BROWSERS: ${{ inputs.browsers || '10' }}
        run: xvfb-run -a node scripts/benchmark.cjs .measurements/runtime .recovery/reference .measurements/baseline.json "$SOAK_SECONDS" "$BROWSERS"
      - name: Measure optimized source
        if: always()
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '60' }}
          BROWSERS: ${{ inputs.browsers || '10' }}
        run: xvfb-run -a node scripts/benchmark.cjs .measurements/runtime . .measurements/optimized.json "$SOAK_SECONDS" "$BROWSERS"
      - name: Compare saved measurements
        if: always()
        run: |
          node scripts/compare-benchmarks.cjs .measurements/baseline.json .measurements/optimized.json .measurements/comparison.md
          cat .measurements/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOM-Linux-baseline-comparison
          path: .measurements/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOM-Linux-comparison-report
          path: .measurements/comparison.md
          retention-days: 30

  publish-linux:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-linux, compare-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DOM-v0.5.6-Ubuntu-x64
          path: release-linux
      - uses: actions/download-artifact@v4
        with:
          name: DOM-Linux-comparison-report
          path: release-linux
      - uses: actions/download-artifact@v4
        with:
          name: DOM-Linux-baseline-comparison
          path: release-linux
      - name: Publish verified Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(node -p 'require("./package.json").linuxRelease')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; its artifacts will not be overwritten."
            exit 0
          fi
          cd release-linux
          sha256sum *.AppImage *.tar.gz > SHA256SUMS
          cd ..
          gh release create "$TAG" release-linux/*.AppImage release-linux/*.tar.gz release-linux/SHA256SUMS release-linux/comparison.md release-linux/baseline.json release-linux/optimized.json --target "$GITHUB_SHA" --title "DOM v0.5.6 - selectable proxy APIs" --notes "DOM desktop release with simultaneous keyword assignment, user-selectable All Working and ProxyScrape Free APIs, editable provider endpoints, and corrected first navigation/status handling. Target matching, challenge handling, Keep Alive, rotation and browser controls retain the recovered workflow. Ubuntu CI runs source tests, packaged Electron and AppImage checks, an installed sandbox check and paired runtime measurements before publishing."
