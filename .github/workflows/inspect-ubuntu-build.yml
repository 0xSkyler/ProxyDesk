name: Inspect ProxyDesk v0.5.4 for Ubuntu build

on:
  push:
    branches:
      - ubuntu-build-v0.5.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          npm install -g @electron/asar

      - name: Extract Windows installer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p extracted
          7z x "ProxyDesk-v0.5.4-MultiKeyword-AllWorking-Setup(1).exe" -oextracted
          echo "=== TOP-LEVEL EXTRACTED FILES ==="
          find extracted -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | head -200

      - name: Expand nested archives and locate app.asar
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p unpacked
          mapfile -t archives < <(find extracted -type f \( -iname '*.7z' -o -iname '*.zip' \) | sort)
          if [ "${#archives[@]}" -gt 0 ]; then
            i=0
            for a in "${archives[@]}"; do
              d="unpacked/archive-$i"
              mkdir -p "$d"
              echo "Extracting $a -> $d"
              7z x "$a" -o"$d" || true
              i=$((i+1))
            done
          fi
          echo "=== APP.ASAR CANDIDATES ==="
          find extracted unpacked -type f -name 'app.asar' -print || true
          echo "=== RESOURCE DIRECTORIES ==="
          find extracted unpacked -type d -name resources -print || true

      - name: Inspect packaged Electron app
        shell: bash
        run: |
          set -euxo pipefail
          APP_ASAR="$(find extracted unpacked -type f -name 'app.asar' | head -1 || true)"
          if [ -z "$APP_ASAR" ]; then
            echo "::error::app.asar not found"
            exit 1
          fi
          echo "APP_ASAR=$APP_ASAR"
          mkdir recovered
          asar extract "$APP_ASAR" recovered
          echo "=== RECOVERED ROOT ==="
          find recovered -maxdepth 2 -type f -printf '%p\n' | sort | head -300
          echo "=== PACKAGE.JSON ==="
          cat recovered/package.json
          echo "=== NATIVE MODULES / UNPACKED FILES ==="
          find recovered -type f \( -name '*.node' -o -name '*.dll' -o -name '*.exe' \) -print | sort | head -200 || true
