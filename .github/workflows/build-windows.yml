name: DOM v0.5.20 Windows build and release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Check the bundled Electron Node runtime
        run: node scripts/check-bundled-runtime.cjs
      - name: Build Windows installer from tracked source
        run: npm run package:windows
      - name: Check production archive
        run: node scripts/check-package.cjs release-windows/win-unpacked/resources/app.asar
      - name: Smoke test unpacked Windows application
        run: node scripts/smoke-runtime.cjs release-windows/win-unpacked/DOM.exe
      - name: Recognize and open results before Google finishes loading
        run: node scripts/smoke-google-recognition.cjs release-windows/win-unpacked/DOM.exe
      - name: Install into a clean directory
        shell: pwsh
        run: |
          $installer = Resolve-Path 'release-windows/DOM-v0.5.20-Windows-x64-Setup.exe'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'DOM-v0.5.20-installed'
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)" }
          $installedExecutable = Join-Path $installDirectory 'DOM.exe'
          if (-not (Test-Path $installedExecutable)) { throw "Installed executable not found at $installedExecutable" }
          "DOM_INSTALLED_EXE=$installedExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke test installed Windows application
        shell: pwsh
        run: node scripts/smoke-runtime.cjs "$env:DOM_INSTALLED_EXE"
      - name: Verify recognition in the installed application
        shell: pwsh
        run: node scripts/smoke-google-recognition.cjs "$env:DOM_INSTALLED_EXE"
      - name: Verify installed selective proxy and keyword rotation
        shell: pwsh
        run: node scripts/smoke-proxy-rotation.cjs "$env:DOM_INSTALLED_EXE"
      - name: Verify installed Google prompts and cycle cache cleanup
        shell: pwsh
        run: node scripts/smoke-google-prompts.cjs "$env:DOM_INSTALLED_EXE"
      - name: Verify forty-second full-page scrolling in the installed app
        shell: pwsh
        run: node scripts/smoke-keep-alive-reading.cjs "$env:DOM_INSTALLED_EXE"
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-Item 'release-windows/DOM-v0.5.20-Windows-x64-Setup.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content 'release-windows/DOM-v0.5.20-Windows-x64-SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DOM-v0.5.20-Windows-x64
          path: |
            release-windows/DOM-v0.5.20-Windows-x64-Setup.exe
            release-windows/DOM-v0.5.20-Windows-x64-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DOM-v0.5.20-Windows-x64
          path: release-assets
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/dom-windows-release-notes.md <<'NOTES'
          DOM 0.5.20 clicks enabled Google Continue controls with native mouse events, including link-style controls and verification forms. The handler retries while the enabled prompt remains present, waits for disabled controls, and resumes the same search without waiting for Ready. Native navigation-start tracking prevents a second click during a slow Continue redirect. Accept all uses the same per-browser handler.

          Keep Alive now spends forty seconds scrolling each article from top to bottom and back to top, then clicks an actual internal article link and repeats on the next page. Short holds at both ends cover the full page; page height is refreshed for lazy content. Ten-second chunks preserve progress while keeping Stop and rotation responsive.

          Healthy proxy retention, failed-proxy replacement, next-keyword rotation, per-cycle cache cleanup and actual Google result-title clicks remain in place. Validation includes installed native Continue/consent/cache checks, two forty-second article visits with full-page scrolling and cancellation, selective proxy rotation, 76 Google layouts, 23 opening scenarios and 50 unfinished-load browsers. SHA-256 checksums are included.
          NOTES
          TAG="$(node -p 'require("./package.json").windowsRelease')"
          test "$GITHUB_REF_NAME" = "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; its artifacts will not be overwritten."
            exit 0
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "DOM v0.5.20 for Windows" --notes-file /tmp/dom-windows-release-notes.md
          fi
