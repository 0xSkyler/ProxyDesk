name: DOM v0.5.15 Windows build and release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Check the bundled Electron Node runtime
        run: node scripts/check-bundled-runtime.cjs
      - name: Build Windows installer from tracked source
        run: npm run package:windows
      - name: Check production archive
        run: node scripts/check-package.cjs release-windows/win-unpacked/resources/app.asar
      - name: Smoke test unpacked Windows application
        run: node scripts/smoke-runtime.cjs release-windows/win-unpacked/DOM.exe
      - name: Recognize and open results before Google finishes loading
        run: node scripts/smoke-google-recognition.cjs release-windows/win-unpacked/DOM.exe
      - name: Install into a clean directory
        shell: pwsh
        run: |
          $installer = Resolve-Path 'release-windows/DOM-v0.5.15-Windows-x64-Setup.exe'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'DOM-v0.5.15-installed'
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)" }
          $installedExecutable = Join-Path $installDirectory 'DOM.exe'
          if (-not (Test-Path $installedExecutable)) { throw "Installed executable not found at $installedExecutable" }
          "DOM_INSTALLED_EXE=$installedExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke test installed Windows application
        shell: pwsh
        run: node scripts/smoke-runtime.cjs "$env:DOM_INSTALLED_EXE"
      - name: Verify recognition in the installed application
        shell: pwsh
        run: node scripts/smoke-google-recognition.cjs "$env:DOM_INSTALLED_EXE"
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-Item 'release-windows/DOM-v0.5.15-Windows-x64-Setup.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content 'release-windows/DOM-v0.5.15-Windows-x64-SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DOM-v0.5.15-Windows-x64
          path: |
            release-windows/DOM-v0.5.15-Windows-x64-Setup.exe
            release-windows/DOM-v0.5.15-Windows-x64-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DOM-v0.5.15-Windows-x64
          path: release-assets
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/dom-windows-release-notes.md <<'NOTES'
          DOM v0.5.15 keeps the /goto title support introduced in 0.5.14 and fixes late target navigation being mislabeled as a failed click. DOM initiates the actual result-title click immediately, then allows up to 8.5 seconds for the target URL to commit and checks the landing once more before reporting failure. The initial click timing is unchanged; Ready and full-page loading are not prerequisites.

          Google /goto links decode supported q/url destinations or activate their own verified opaque title link. Results open only through their actual title link. An ignored or failed click is reported and retried; DOM does not load the captured article URL directly. Target landing is verified before Keep Alive, with publisher ownership, neighboring-result, foreign-destination, script-URL, visibility, disabled and sponsored checks preserved.

          Controlled native validation covers 76 layouts, 23 successful opening/pagination scenarios including a five-second first-byte target response, an ignored-click rejection and 50 concurrent browsers mixing direct, /url and /goto title links with two keywords and lost startup handshakes. DOM 0.5.13 reproduces the original /goto rejection; 0.5.14's installed Windows check exposed the late-commit failure. Keywords, proxy selection, rotation and Keep Alive retain their existing behavior.

          Native Windows validation includes a clean NSIS installation, recognition in the installed application and lifecycle checks. A SHA-256 manifest is included.
          NOTES
          TAG="$(node -p 'require("./package.json").windowsRelease')"
          test "$GITHUB_REF_NAME" = "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; its artifacts will not be overwritten."
            exit 0
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "DOM v0.5.15 for Windows" --notes-file /tmp/dom-windows-release-notes.md
          fi
